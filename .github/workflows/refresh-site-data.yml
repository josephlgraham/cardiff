name: Refresh Site Data

# Off the hour for the same reason as the other two: on the hour these started
# two to four and a half hours late. The timeout is well over the slowest run
# on record, about fifteen minutes on a backfill, and well under the six hour
# default, which a hung source would otherwise hold the shared queue for.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5,17 * * *'

permissions:
  contents: write

concurrency:
  group: data-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # The species photographs are shrunk with sharp, the one package from
      # node_modules the fetch step uses, and only when a species turns up here
      # without a photograph. The runner starts without it. If the registry is
      # down the install fails, that species waits for the next run, and the
      # weather goes out regardless, hence continue-on-error. See DECISIONS.md 83.
      - name: Install the image library
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      # News is not gathered here any more. It has its own script and its own
      # schedule in refresh-news.yml, because a morning report wants gathering
      # in the morning.
      - name: Refresh weather, watershed, and civic snapshot files
        run: node scripts/fetch-site-data.mjs
        env:
          AW_API_KEY: ${{ secrets.AW_API_KEY }}
          AW_APP_KEY: ${{ secrets.AW_APP_KEY }}

      # Heritage is prose, not a feed, so this reads nothing from the network
      # and only rewrites the eight heritage pages when fivemile-heritage.json
      # has moved under them. It is here rather than in a workflow of its own so
      # the prerender can never sit stale behind a hand edit to the JSON: the
      # next scheduled run catches it whether anybody remembered or not. A bug
      # in it must not cost the run its weather, hence continue-on-error.
      # See DECISIONS.md 53.
      - name: Write the heritage prose into the heritage pages
        continue-on-error: true
        run: node scripts/build-heritage-pages.mjs

      # The monthly edition. It reads nothing from the network: the fetch step
      # above has already brought in the airport record and NOAA's outlook. On
      # every run but the one that falls due it works nothing out and only
      # redraws the pages from the frozen editions, which changes no file unless
      # the room page shell has moved. Due means the 2nd of the month or later,
      # the last day of the month before in the airport record, and NOAA's
      # outlook for the new month in, or the 5th. The edition's PDF is printed
      # once, with the Chrome that ships on this runner, and never reprinted on
      # a later run. continue-on-error for the same reason as the heritage step.
      # See DECISIONS.md 74.
      - name: Put out the monthly edition when one is due
        continue-on-error: true
        run: node scripts/build-editions.mjs

      - name: Commit refreshed data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          # sitemap.xml is staged because the heritage build writes the lastmod
          # dates into it off fivemile-heritage.json. Without it those dates
          # would be regenerated every run and never committed.
          git add fivemile-weather.json fivemile-watershed.json fivemile-watershed-weather.json fivemile-air-quality.json fivemile-rain-log.json fivemile-weather-archive/ fivemile-creek-archive/ fivemile-creek-peaks.json fivemile-creek-quality.json fivemile-creek-flashiness.json fivemile-creek-samples.json fivemile-airport-archive/ fivemile-airport-normals.json fivemile-observations.json fivemile-species-photos.json fivemile_photos/species/ fivemile-hollers.json fivemile-heritage*.html sitemap.xml announcements.json fivemile-echo.json fivemile-outlooks.json fivemile-sayings.json fivemile-editions/ fivemile-edition-*.html fivemile-edition-*.pdf
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: daily refresh"
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto latest main (attempt $attempt)."
            git fetch origin main
            # Replayed (our) commit wins on conflict: these files are regenerated, so freshest data is correct.
            git rebase -X theirs origin/main || git rebase --abort
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push refreshed data after 5 attempts." >&2
          exit 1
