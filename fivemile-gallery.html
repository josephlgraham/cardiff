:root{

  --paper:#F2E8D5;--card:#FAF6EE;
  --ink:#1C1208;
  --masthead:#3D2810;
  --sans:"Plus Jakarta Sans",system-ui,sans-serif;--mono:"DM Mono",monospace;

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* Postcards two across, which is the width the card was drawn for. Grid

<script>
/* ===========================================================================
   Gallery. Reads the same file the front page reads, so a photograph is
   archived by the act of being featured and there is no second list to keep
   in step. Newest first, and anything with no date on it sorts to the end.
   =========================================================================== */
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML}

function loadJson(url){
  return fetch(url, {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error(String(r.status));
    return r.json();
  });
}

/* Same rule as the front page. A photograph carries its own provenance in its
   file name, what-it-is_monthyear_first-last.jpg, as in
   brookside_fog_sept2022_joe-graham.jpg. The subject may hold underscores, so
   the date is found by pattern; the month is read from its first three
   letters, so sept and sep and september agree. The JSON fields win where set,
   and a file matching neither reads as an em dash rather than a guess.

   Month here is 1 based, because the sort below compares it as a number.
   Keep this in step with fileFacts in index.html. */
var MONTH_KEYS = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function fileFacts(src){
  var name = String(src || '').split('?')[0].split('/').pop().replace(/\.[A-Za-z0-9]+$/, '');
  var month, year, who;
  var named = name.match(/^(.+)_([A-Za-z]+)(\d{4})_([A-Za-z][A-Za-z0-9-]*)$/);
  if(named){
    month = MONTH_KEYS[named[2].slice(0, 3).toLowerCase()];
    year = named[3];
    who = named[4];
  }else{
    var dated = name.match(/^(.+)_(\d{4})-(\d{2})_([A-Za-z][A-Za-z0-9-]*)$/);
    if(!dated) return {year:null, month:null, credit:''};
    month = Number(dated[3]);
    year = dated[2];
    who = dated[4];
  }
  if(!month || month < 1 || month > 12) return {year:null, month:null, credit:''};
  return {
    year: year, month: month,
    credit: who.split('-').filter(Boolean).map(function(part){
      return part.charAt(0).toUpperCase() + part.slice(1);
    }).join(' ')
  };
}
function takenKey(item){
  var raw = String(item.taken || '').trim().match(/^(\d{4})-(\d{2})/);
  if(raw){
    var month = Number(raw[2]);
    return (month >= 1 && month <= 12) ? {year:raw[1], month:month} : null;
  }
  var facts = fileFacts(item.src);
  return facts.year ? {year:facts.year, month:facts.month} : null;
}
function takenLabel(item){
  var key = takenKey(item);
  return key ? MONTHS[key.month - 1] + ' ' + key.year : '';
}
function creditOf(item){
  return String(item.credit || '').trim() || fileFacts(item.src).credit;
}

function render(items){
  var target = document.getElementById('gallery');
  var clean = items.filter(function(item){return item && item.src});
  if(!clean.length) return;

  clean.sort(function(a, b){
    var ka = takenKey(a), kb = takenKey(b);
    if(!ka && !kb) return 0;
    if(!ka) return 1;
    if(!kb) return -1;
    return (kb.year - ka.year) || (kb.month - ka.month);
  });

  target.innerHTML = clean.map(function(item){
    var src = String(item.src).indexOf('/') > -1 ? item.src : 'fivemile_photos/' + item.src;
    var credit = creditOf(item);
    var taken = takenLabel(item);
    return '<div class="card-post">' +
      '<div class="p-img"><img src="' + esc(src) + '" alt="' + esc(item.alt || '') + '" loading="lazy" decoding="async"></div>' +
      '<div class="p-bd">' +
        '<div class="p-lf">' +
          '<h3>' + esc(item.title || '&mdash;') + '</h3>' +
          '<p>' + esc(item.copy || '') + '</p>' +
        '</div>' +
        '<div class="p-rt">' +
          '<div class="p-stamp">' + (credit ? esc(credit.toUpperCase()) : '&mdash;') + '</div>' +
          '<div class="p-yr">' + (taken ? esc(taken) : '&mdash;') + '</div>' +
        '</div>' +
      '</div></div>';
  }).join('');
}

loadJson('fivemile-home-anchor.json').then(function(data){
  if(data && Array.isArray(data.items)) render(data.items);
}).catch(function(){});
</script>
